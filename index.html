<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h2>Score:
            <span id="score">0</span>
        </h2>
    </header>

    <h1>🐍 Snake Game</h1>
    <p class="description">
        Eat the fruits, grow the snake, and achieve the highest score!
    </p>

    <div class="menu">

        <button id="startBtn" onclick="startGame()">
            ▶ Start Game
        </button>

        <button id="pauseBtn" onclick="pauseGame()" style="display:none;">
            ⏸ Pause
        </button>

    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <br><br>

    <button onclick="restartGame()">Restart Game</button>

    <script src="script.js"></script>

    <footer>
        <p>© 2026 Snake Game | Created by Bimal Khadgi</p>
    </footer>

</body>

</html>
