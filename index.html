<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ONE AND ONLY INTRO -->
    <div id="introScreen">

        <h1>🐍 Snake Game</h1>

        <p>This Snake Game was created as a school assignment.</p>

        <p>Created by Bimal Khadgi</p>

        <p>Eat the fruits, grow the snake, and achieve the highest score!</p>

        <p>Use the arrow keys to control the snake.</p>

        <button id="introStartBtn" onclick="startGame()">
            ▶ START GAME
        </button>

    </div>


    <!-- GAME -->
    <div id="gameArea">

        <h2>
            Score: <span id="score">0</span>
        </h2>

        <div class="menu">

            <button id="startBtn" onclick="startGame()">
                ▶ Start Game
            </button>

            <button id="pauseBtn" onclick="pauseGame()">
                ⏸ Pause
            </button>

        </div>

        <canvas id="game" width="400" height="400"></canvas>

        <br>

        <button onclick="restartGame()">
            🔄 Restart Game
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
